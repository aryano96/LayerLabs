<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Course Planner tests</title>
  <style>body{font-family:monospace;font-size:16px;padding:1rem}.fail{color:#b00020;font-weight:bold}.pass{color:#1b5e20}</style>
</head>
<body>
  <h1>logic.js tests</h1>
  <pre id="out">Running...</pre>
  <script src="logic.js"></script>
  <script src="tests.js"></script>
  <script>
    // Load the real course data, then run every check and show the results.
    fetch("data/courses.json")
      .then((r) => r.json())
      .then((courses) => {
        const lines = [];
        const result = runTests(window.CourseLogic, courses, (line) => lines.push(line));
        const out = document.getElementById("out");
        out.innerHTML = "";
        lines.forEach((line) => {
          const span = document.createElement("div");
          span.className = line.startsWith("FAIL") ? "fail" : "pass";
          span.textContent = line;
          out.appendChild(span);
        });
        const sum = document.createElement("div");
        sum.textContent = `\n${result.passed} passed, ${result.failed} failed`;
        out.appendChild(sum);
      })
      .catch((e) => { document.getElementById("out").textContent = "Could not load data: " + e; });
  </script>
</body>
</html>
